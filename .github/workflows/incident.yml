name: Incident Automation

on:
  workflow_dispatch:

jobs:
  incident-health-check:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Run Automation
        run: |
          chmod +x incident_automation.sh
          ./incident_automation.sh
`
